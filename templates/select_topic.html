{% extends 'base.html' %}
{% block title %}Select Topic – APTA{% endblock %}
{% block content %}
<div class="card mx-auto">
  <h3>🎯 Select a Topic</h3>
  <p class="text-center text-muted mb-4">Choose the topic you want to learn today</p>
  {% if error %}
  <div class="alert alert-danger py-2">{{ error }}</div>
  {% endif %}
  <form method="post">
    <div class="mb-4">
      <label for="topicSelect" class="form-label fw-semibold">Topic</label>
      <select name="topic" id="topicSelect" class="form-select form-select-lg" required>
        <option value="" disabled selected>Choose a topic...</option>
        {% for topic in topics %}
        <option value="{{ topic }}">{{ topic }}</option>
        {% endfor %}
      </select>
    </div>
    <button type="submit" class="btn btn-primary w-100 btn-lg">Start Initial Quiz →</button>
  </form>
</div>
{% endblock %}
