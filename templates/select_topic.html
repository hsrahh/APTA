{% extends 'base.html' %}
{% block title %}Choose Your Topic - AI Python Tutor{% endblock %}
{% block content %}
<div class="glass-card">
  <div class="text-center mb-4">
    <i class="fas fa-book-open" style="font-size: 4rem; color: rgba(255, 255, 255, 0.8); margin-bottom: 20px;"></i>
    <h1 class="page-title">Choose Your Learning Topic</h1>
    <p class="page-subtitle">Select a Python topic to begin your personalized learning journey</p>
  </div>
  
  <form method="post">
    <div class="form-group">
      <label class="form-label">
        <i class="fas fa-graduation-cap"></i> Learning Topic
      </label>
      <select name="topic" class="form-select" required>
        <option value="" disabled selected>Select a topic to learn...</option>
        {% for topic in topics %}
          <option value="{{ topic }}">{{ topic }}</option>
        {% endfor %}
      </select>
    </div>
    
    <div class="text-center">
      <button type="submit" class="btn btn-primary btn-lg">
        <i class="fas fa-play"></i> Start Pre-Assessment Quiz
      </button>
    </div>
  </form>
  
  <div class="mt-4">
    <div class="row">
      <div class="col-md-4 text-center">
        <i class="fas fa-clipboard-check" style="font-size: 2rem; color: rgba(255, 255, 255, 0.7);"></i>
        <p style="color: rgba(255, 255, 255, 0.8); font-size: 0.9rem; margin-top: 10px;">Pre-Assessment</p>
      </div>
      <div class="col-md-4 text-center">
        <i class="fas fa-comments" style="font-size: 2rem; color: rgba(255, 255, 255, 0.7);"></i>
        <p style="color: rgba(255, 255, 255, 0.8); font-size: 0.9rem; margin-top: 10px;">AI Tutoring</p>
      </div>
      <div class="col-md-4 text-center">
        <i class="fas fa-chart-line" style="font-size: 2rem; color: rgba(255, 255, 255, 0.7);"></i>
        <p style="color: rgba(255, 255, 255, 0.8); font-size: 0.9rem; margin-top: 10px;">Final Assessment</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
```
