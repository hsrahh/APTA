<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}APTA – AI Personal Tutor{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --apta-blue: #1565c0;
      --apta-blue-dark: #0d47a1;
      --apta-blue-light: #e3f2fd;
      --apta-white: #ffffff;
      --apta-text: #1a237e;
      --apta-muted: #5c6bc0;
    }

    body {
      background: linear-gradient(135deg, var(--apta-blue-light) 0%, var(--apta-white) 50%, #bbdefb 100%);
      color: var(--apta-text);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
    }

    .apta-header {
      background: linear-gradient(90deg, var(--apta-blue-dark), var(--apta-blue));
      color: var(--apta-white);
      padding: 14px 0;
      box-shadow: 0 2px 12px rgba(13, 71, 161, 0.25);
    }

    .apta-header h1 {
      font-size: 1.35rem;
      margin: 0;
      font-weight: 700;
    }

    .apta-header p {
      margin: 0;
      font-size: 0.85rem;
      opacity: 0.9;
    }

    .step-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin-bottom: 1.5rem;
    }

    .step-item {
      font-size: 0.72rem;
      padding: 4px 10px;
      border-radius: 20px;
      background: #e8eaf6;
      color: var(--apta-muted);
      font-weight: 600;
    }

    .step-item.active {
      background: var(--apta-blue);
      color: var(--apta-white);
    }

    .step-item.done {
      background: #c8e6c9;
      color: #2e7d32;
    }

    .container-main {
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    .card {
      background: var(--apta-white);
      border: 1px solid #90caf9;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(21, 101, 192, 0.12);
      padding: 28px;
      width: 100%;
    }

    .card h3, .card h4 {
      color: var(--apta-blue-dark);
      font-weight: 700;
      text-align: center;
      margin-bottom: 1.25rem;
    }

    .form-control, .form-select, textarea.form-control {
      background: var(--apta-white);
      border: 2px solid #90caf9;
      color: var(--apta-text);
      border-radius: 10px;
      padding: 10px 14px;
    }

    .form-control:focus, .form-select:focus, textarea.form-control:focus {
      border-color: var(--apta-blue);
      box-shadow: 0 0 0 0.2rem rgba(21, 101, 192, 0.2);
    }

    .form-control::placeholder {
      color: #7986cb;
    }

    .btn-primary {
      background: linear-gradient(90deg, var(--apta-blue), var(--apta-blue-dark));
      border: none;
      border-radius: 10px;
      padding: 10px 20px;
      font-weight: 600;
    }

    .btn-primary:hover {
      background: linear-gradient(90deg, var(--apta-blue-dark), #082a5e);
      transform: translateY(-1px);
    }

    .btn-success {
      background: #2e7d32;
      border: none;
      border-radius: 10px;
      font-weight: 600;
    }

    .btn-success:hover {
      background: #1b5e20;
    }

    .question-box {
      background: var(--apta-blue-light);
      border: 1px solid #90caf9;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .form-check-label {
      color: var(--apta-text);
    }

    .form-check-input:checked {
      background-color: var(--apta-blue);
      border-color: var(--apta-blue);
    }

    .alert-info-custom {
      background: var(--apta-blue-light);
      border: 1px solid #64b5f6;
      color: var(--apta-blue-dark);
      border-radius: 12px;
      padding: 16px;
    }

    .list-group-item {
      background: var(--apta-white);
      border: 1px solid #e3f2fd;
      color: var(--apta-text);
      margin-bottom: 8px;
      border-radius: 10px !important;
    }

    .badge-score {
      background: var(--apta-blue) !important;
      font-size: 0.95rem;
      padding: 6px 12px;
    }

    .explanation-box {
      background: var(--apta-blue-light);
      border-left: 4px solid var(--apta-blue);
      padding: 12px;
      border-radius: 8px;
      color: var(--apta-text);
    }

    #chat-box {
      background: #f5f9ff !important;
      border: 2px solid #90caf9 !important;
      color: var(--apta-text) !important;
    }

    .chat-user { color: var(--apta-blue-dark); }
    .chat-ai { color: #2e7d32; }
    .chat-error { color: #c62828; }

    .perf-banner {
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .perf-banner.success { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
    .perf-banner.primary { background: #e3f2fd; color: var(--apta-blue-dark); border: 1px solid #90caf9; }
    .perf-banner.info { background: #e1f5fe; color: #0277bd; border: 1px solid #81d4fa; }
    .perf-banner.warning { background: #fff3e0; color: #e65100; border: 1px solid #ffcc80; }
    .perf-banner.secondary { background: #eceff1; color: #455a64; border: 1px solid #b0bec5; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <header class="apta-header text-center">
    <div class="container">
      <h1>🧠 APTA – AI Personal Tutor</h1>
      <p>Assess · Learn · Improve · Track Performance</p>
    </div>
  </header>

  <div class="container-main">
    {% if step is defined %}
    <div class="step-bar">
      <span class="step-item {% if step == 1 %}active{% elif step > 1 %}done{% endif %}">1. Login</span>
      <span class="step-item {% if step == 2 %}active{% elif step > 2 %}done{% endif %}">2. Topic</span>
      <span class="step-item {% if step == 3 %}active{% elif step > 3 %}done{% endif %}">3. Quiz</span>
      <span class="step-item {% if step == 4 %}active{% elif step > 4 %}done{% endif %}">4. Reflect</span>
      <span class="step-item {% if step == 5 %}active{% elif step > 5 %}done{% endif %}">5. AI Study</span>
      <span class="step-item {% if step == 6 %}active{% elif step > 6 %}done{% endif %}">6. Final Quiz</span>
      <span class="step-item {% if step == 7 %}active{% endif %}">7. Dashboard</span>
    </div>
    {% endif %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
