{% extends 'base.html' %}
{% block title %}Login – APTA{% endblock %}
{% block content %}
<div class="card mx-auto">
  <h3>🔐 Student Login</h3>
  <p class="text-center text-muted mb-4">Enter your details to start your learning session</p>
  <form method="post">
    <div class="mb-3">
      <label class="form-label fw-semibold">Reference ID</label>
      <input name="ref_id" class="form-control form-control-lg" placeholder="e.g. DIP001" required>
    </div>
    <div class="mb-3">
      <label class="form-label fw-semibold">Your Name</label>
      <input name="name" class="form-control form-control-lg" placeholder="Full name" required>
    </div>
    <div class="mb-3">
      <label class="form-label fw-semibold">Gender</label>
      <select name="gender" class="form-select form-select-lg" required>
        <option value="" disabled selected>Select gender</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
        <option value="other">Other</option>
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label fw-semibold">Age</label>
      <input name="age" type="number" min="16" max="60" class="form-control form-control-lg" placeholder="Your age" required>
    </div>
    <div class="mb-4">
      <label class="form-label fw-semibold">Profession</label>
      <select name="profession" class="form-select form-select-lg" required>
        <option value="" disabled selected>Select profession</option>
        <option value="student">Student</option>
        <option value="IT employee">IT Employee</option>
        <option value="finance employee">Finance Employee</option>
        <option value="freelancer">Freelancer</option>
        <option value="software developer">Software Developer</option>
      </select>
    </div>
    <button type="submit" class="btn btn-primary w-100 btn-lg">Login & Continue →</button>
  </form>
</div>
{% endblock %}
