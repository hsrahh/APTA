{% extends 'base.html' %}
{% block title %}What You Learned – APTA{% endblock %}
{% block content %}
<div class="card">
  <h4>✍️ What Did You Learn from the Quiz?</h4>
  <div class="alert-info-custom text-center mb-3">
    Topic: <strong>{{ topic }}</strong> &nbsp;|&nbsp;
    Initial quiz score: <strong>{{ pre_score }} / {{ total }}</strong>
  </div>
  <form method="post">
    <div class="mb-4">
      <label class="form-label fw-semibold">Your explanation (in your own words)</label>
      <textarea name="explanation" rows="8" class="form-control form-control-lg"
        placeholder="Write what you understood from the initial quiz. Mention concepts you found easy or difficult..."
        required minlength="20"></textarea>
      <small class="text-muted">Minimum 20 characters. This helps the AI tutor understand your level.</small>
    </div>
    <div class="text-center">
      <button type="submit" class="btn btn-primary btn-lg">Continue → Study with AI Tutor</button>
    </div>
  </form>
</div>
{% endblock %}
